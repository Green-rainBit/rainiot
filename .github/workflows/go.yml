name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO111MODULE: on
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # 已支持 Node.js 24

      - name: 通知 - 构建开始
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{
              "msgtype": "markdown",
              "markdown": {
                "content": "## 🚀 构建开始\n> **仓库**: ${{ github.repository }}\n> **分支**: ${{ github.ref_name }}\n> **提交**: ${{ github.sha }}\n> [查看运行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }' \
            ${{ secrets.WECHAT_WEBHOOK_URL }}
        shell: bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: 通知 - 构建完成
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ 成功"
          else
            STATUS="❌ 失败"
          fi
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"## 构建完成：$STATUS\n> **仓库**: ${{ github.repository }}\n> **分支**: ${{ github.ref_name }}\n> **状态**: ${{ job.status }}\n> [查看详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
              }
            }" \
            ${{ secrets.WECHAT_WEBHOOK_URL }}
        shell: bash
