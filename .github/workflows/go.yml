name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO111MODULE: on
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. 发送"构建开始"通知
      - name: Notify - Build started
        env:
          WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "[WARN] WEBHOOK_URL secret 未配置，跳过通知"
            exit 0
          fi

          MSG="## 🚀 构建开始
          > **仓库**: ${{ github.repository }}
          > **分支**: ${{ github.ref_name }}
          > **提交**: ${{ github.sha }}
          > **触发者**: ${{ github.actor }}
          > [查看运行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          PAYLOAD=$(echo "$MSG" | jq -R -s '{msgtype:"markdown", markdown:{content:.}}')
          echo "[DEBUG] Webhook URL: ${WEBHOOK_URL%%\?*}"  # 只打印 base，不暴露 key

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" "${WEBHOOK_URL}")
          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "[DEBUG] HTTP ${HTTP_CODE}: ${BODY}"
        shell: bash

      # 3. 设置 Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # 与 go.mod 保持一致

      # 4. 下载依赖
      - name: Download dependencies
        run: go mod download

      # 5. 构建
      - name: Build
        run: go build -v ./...

      # 6. 测试
      - name: Test
        run: go test -v ./...

      # 7. 发送"构建完成"通知（无论成功、失败、取消都执行）
      - name: Notify - Build finished
        if: always()    # 关键：确保总执行
        env:
          WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "[WARN] WEBHOOK_URL secret 未配置，跳过通知"
            exit 0
          fi

          # 根据 job.status 设置中文状态
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_TEXT="✅ 成功"
          elif [ "${{ job.status }}" == "failure" ]; then
            STATUS_TEXT="❌ 失败"
          else
            STATUS_TEXT="⏹️ 已取消"
          fi

          MSG="## 构建完成：${STATUS_TEXT}
          > **仓库**: ${{ github.repository }}
          > **分支**: ${{ github.ref_name }}
          > **提交**: ${{ github.sha }}
          > **状态**: ${{ job.status }}
          > [查看详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          PAYLOAD=$(echo "$MSG" | jq -R -s '{msgtype:"markdown", markdown:{content:.}}')
          echo "[DEBUG] Webhook URL: ${WEBHOOK_URL%%\?*}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" "${WEBHOOK_URL}")
          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          echo "[DEBUG] HTTP ${HTTP_CODE}: ${BODY}"
        shell: bash
